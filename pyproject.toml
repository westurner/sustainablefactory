[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sustainablefactory"
version = "0.1.0"
description = "Modeling sustainable factory processes with Linked Data and MyST Markdown"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "click",
    "pyoxigraph",
    "pyyaml",
    "rdflib",
    # for the docs:
    "sphinx",
    "myst-parser",
    "sphinxcontrib-mermaid",
    "furo",
    "linkify-it-py",
    "requests-cache",
    "pytest-cov",
    "responses"
]

[project.scripts]
sfcli = "sustainablefactory.cli:main"

[tool.setuptools]
packages = ["sustainablefactory"]

[tool.coverage.run]
# Exclude auto-generated schema.py from coverage
omit = [
    "schema.py",
]

[tool.coverage.report]
# Skip files with no executed lines
skip_empty = true

# Exclude lines from coverage
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "if typing.TYPE_CHECKING:",
]
