name: "Build the docs"

on:
  pull_request: 
  push:
    branches:
      - main
      - 'releases/**'
    #paths:
    #  - 'src/**'


jobs:
  build:

    runs-on: ubuntu-latest
    #runs-on: readthedocs/build

    steps:
    - uses: actions/checkout@v1
    # Standard drop-in approach that should work for most people.
    - uses: ammaraskar/sphinx-action@master
      with:
        docs-folder: "docs/"
        build-command: "make html singlehtml" # latexpdf"

    # Grabbing custom dependencies and building as a pdf.
    #- uses: ammaraskar/sphinx-action@master
    #  with:
    #    #pre-build-command: "apt-get update -y && apt-get install -y latexmk texlive-latex-recommended texlive-latex-extra texlive-fonts-recommended"
    #    build-command: "make latexpdf"
    #    docs-folder: "docs2/"
  
    # Great extra actions to compose with:
    # Create an artifact of the html output.
    - uses: actions/upload-artifact@v1
      with:
        name: lignolux.github.io-archive
        path: docs/_build/html/
    # Create an artifact out of the previously built pdf.
    #- uses: actions/upload-artifact@v1
    #  with:
    #    name: Documentation
    #    path: docs/_build/latex/pdfexample.pdf  # TODO
    # Publish built docs to gh-pages branch.
    # ===============================
    - name: Commit documentation changes
      run: |
        git clone https://github.com/ammaraskar/sphinx-action-test.git --branch gh-pages --single-branch gh-pages
        cp -r docs/_build/html/* gh-pages/
        cd gh-pages
        touch .nojekyll
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add .
        git commit -m "DOC: :boat: Built the docs" -a || true
        # The above command will fail if no changes were present, so we ignore
        # that.
    - name: Push changes
      uses: ad-m/github-push-action@master
      with:
        branch: gh-pages
        directory: gh-pages
        github_token: ${{ secrets.GITHUB_TOKEN }}
    # ===============================
