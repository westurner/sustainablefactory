name: Build and test Signals

on:
  pull_request:
  push:
    branches:
      - main
      - "releases/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lean:
    runs-on: ubuntu-latest
    env:
      LEAN_NUM_THREADS: "1"
      LEAN_JOBS: "1"
      DISABLE_EQUATIONS: "1"
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          submodules: recursive

      - name: Check out compatible Physlib
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: westurner/physlib
          ref: f6d7fe3d32f1849a153147f2868d6db2d9daf40a
          path: src/physlib
          persist-credentials: false

      - name: Set up Lean
        uses: leanprover/lean-action@38fbc41a8c28c4cbaec22d7f7de508ec2e7c0dd9 # v1.5.0
        with:
          lake-package-directory: src/signals
          use-mathlib-cache: true
          auto-config: "false"
          build: "false"
          test: "false"
          lint: "false"

      - name: Build Signals and Lean tests
        run: make -C src/signals lean-build

  rust:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build Rust modules and run tests
        run: cargo test --manifest-path src/signals/numerical_adapter/Cargo.toml --all-targets --all-features

  python:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install Python dependencies
        run: python -m pip install -e . -r requirements.txt pytest

      - name: Run Python tests
        run: python -m pytest -q tests/