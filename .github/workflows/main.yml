name: Build the docs

on:
  pull_request:
  push:
    branches:
      - main
      - "releases/**"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read

    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          submodules: recursive

      - name: Detect Signals changes
        id: changes
        uses: dorny/paths-filter@de90cc6fb38fc0963ad72b210f1f284cd68cea36 # v3.0.2
        with:
          base: ${{ github.ref }}
          filters: |
            signals:
              - 'src/signals/**'
              - '.github/workflows/main.yml'
              - '.github/workflows/signals.yml'

      - name: Set up Python
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Check out compatible Physlib
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: westurner/physlib
          ref: f6d7fe3d32f1849a153147f2868d6db2d9daf40a
          path: src/physlib
          persist-credentials: false

      - name: Set up Lean
        uses: leanprover/lean-action@38fbc41a8c28c4cbaec22d7f7de508ec2e7c0dd9 # v1.5.0
        with:
          lake-package-directory: src/signals
          use-mathlib-cache: true
          auto-config: "false"
          build: "false"
          test: "false"
          lint: "false"

      - name: Build Signals
        if: ${{ steps.changes.outputs.signals == 'true' && (github.event_name == 'pull_request' || github.ref == 'refs/heads/main') }}
        run: make -C src/signals lean-build
        env:
          LEAN_NUM_THREADS: "1"

      - name: Install documentation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-docs.txt

      - name: Build documentation
        working-directory: docs
        run: python -m sphinx -M html . _build -j auto

      - name: Upload documentation
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: lignolux.github.io-archive
          path: docs/_build/html/
          if-no-files-found: error

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out deployment branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Download documentation
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: lignolux.github.io-archive
          path: site

      - name: Publish documentation
        run: |
          set -euo pipefail

          git fetch origin gh-pages || true
          if git show-ref --verify --quiet refs/remotes/origin/gh-pages; then
            git worktree add gh-pages origin/gh-pages
          else
            git worktree add --orphan -b gh-pages gh-pages
          fi

          find gh-pages -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf -- {} +
          cp -R site/. gh-pages/
          touch gh-pages/.nojekyll

          git -C gh-pages config user.name "github-actions[bot]"
          git -C gh-pages config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C gh-pages add --all
          if ! git -C gh-pages diff --cached --quiet; then
            git -C gh-pages commit -m "DOC: :boat: Build documentation"
            git push -f origin HEAD:gh-pages
          fi
