name: Tequila multi-backend benchmarks

'on':
#   schedule:
#     - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  benchmarks:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: true

      - name: Set up Python
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: "./requirements*.txt"

      - name: Install project dependencies
        run: python -m pip install -e . -r requirements.txt pytest
        env:
          PIP_ONLY_BINARY: ':all:'
          PYO3_USE_ABI3_FORWARD_COMPATIBILITY: 1

      - name: Install optional simulator backends
        run: python -m pip install "cirq>=1.4,<2" "cirq-google>=1.4,<2" "qiskit>=1.2,<2" "qiskit-aer>=0.15,<1"
        env:
          PIP_ONLY_BINARY: ':all:'

      - name: Verify all benchmark backends are available
        run: >-
          python -c
          'from tequila.simulators.simulator_api import INSTALLED_SIMULATORS; required = {"signals", "qulacs", "cirq", "qiskit"}; missing = required.difference(INSTALLED_SIMULATORS); print("Installed simulators:", ", ".join(sorted(INSTALLED_SIMULATORS))); raise SystemExit(bool(missing))'

      - name: Run complete benchmark suite
        run: make test-tequila-all TEQUILA_MAX_RAM_GB=4

      - name: Upload benchmark reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tequila-multi-backend-benchmarks
          path: docs/reports/tequila/*
          if-no-files-found: warn