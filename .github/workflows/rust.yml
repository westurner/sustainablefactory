
name: Rust tests

on:
  pull_request:
    paths:
      - 'src/signals/numerical_adapter/**'
  push:
    branches:
      - main
      - "releases/**"
    paths:
      - 'src/signals/numerical_adapter/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust:

    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          #submodules: recursive
          submodules: true

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build Rust modules and run tests
        run: cargo test --manifest-path src/signals/numerical_adapter/Cargo.toml --all-targets --all-features
        env:
          PYO3_USE_ABI3_FORWARD_COMPATIBILITY: 1
