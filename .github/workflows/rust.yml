
name: Rust tests

on:
  pull_request:
    paths:
      - 'src/signals/numerical_adapter/**'
  push:
    branches:
      - main
      - "releases/**"
    paths:
      - 'src/signals/numerical_adapter/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust:

    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          #submodules: recursive
          submodules: true

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build Rust modules and run tests
        run: cargo test --manifest-path src/signals/numerical_adapter/Cargo.toml --all-targets --all-features
        env:
          PYO3_USE_ABI3_FORWARD_COMPATIBILITY: 1
