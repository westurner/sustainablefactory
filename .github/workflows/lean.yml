
name: Build and test Signals Lean library

on:
  pull_request:
    paths:
      - 'src/signals/**'
  push:
    branches:
      - main
      - "releases/**"
    paths:
      - 'src/signals/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lean:
    runs-on: ubuntu-latest
    env:
      LEAN_NUM_THREADS: "1"
      LEAN_JOBS: "1"
      DISABLE_EQUATIONS: "1"
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          submodules: recursive

      - name: Check out compatible Physlib
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: westurner/physlib
          ref: f6d7fe3d32f1849a153147f2868d6db2d9daf40a
          path: src/physlib
          persist-credentials: false

      - name: Set up Lean
        uses: leanprover/lean-action@38fbc41a8c28c4cbaec22d7f7de508ec2e7c0dd9 # v1.5.0
        with:
          lake-package-directory: src/signals
          use-mathlib-cache: true
          auto-config: "false"
          build: "false"
          test: "false"
          lint: "false"

      - name: Build Signals and Lean tests
        run: make -C src/signals lean-build