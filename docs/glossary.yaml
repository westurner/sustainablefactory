  year: 1900
  wikipedia: https://en.wikipedia.org/wiki/Planck_constant

Reduced Planck constant:
  definition: |
    {term}`Planck constant` divided by 2 times {term}`Pi`

    - ℏ = h/2*pi
    - hbar = h/2*pi

  synonyms:
