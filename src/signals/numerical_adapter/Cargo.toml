[package]
name = "signals-numerical-adapter"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "Apache-2.0"
description = "Native numerical boundary for Signals Pending diagnostics"

[features]
default = []
cylinder = ["dep:memmap2", "dep:rayon"]
hdf5 = ["dep:hdf5-pure", "dep:sha2"]
jhtdb = ["dep:hdf5-pure", "dep:rayon", "dep:sha2"]
vortex = ["dep:tokio", "dep:vortex", "vortex/tokio"]

[dependencies]
hdf5-pure = { version = "0.46.1", optional = true }
memmap2 = { version = "0.9.11", optional = true }
rayon = { version = "1.11.0", optional = true }
sha2 = { version = "0.10.9", optional = true }
tokio = { version = "1.47.1", features = ["macros", "rt-multi-thread"], optional = true }
vortex = { version = "0.86.1", default-features = false, features = ["files", "zstd"], optional = true }

[[bin]]
name = "signals-numerical-adapter"
path = "src/main.rs"

[[bin]]
name = "cylinder-ftle"
path = "src/bin/cylinder_ftle.rs"
required-features = ["cylinder"]

[[bin]]
name = "jhtdb-ftle"
path = "src/bin/jhtdb_ftle.rs"
required-features = ["jhtdb"]

[[bin]]
name = "jhtdb-vortex-export"
path = "src/bin/jhtdb_vortex_export.rs"
required-features = ["jhtdb", "vortex"]
