[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "docindex-cli"
version = "0.1.0"
description = "CLI for docindex-core indexing and search workflows"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "docindex-core>=0.1.0",
  "click>=8.4.1",
  "python-dotenv>=1.2.2",
  "markdown>=3.10.2",
  "bleach>=6.4.0",
  "markdownify>=1.2.2"
]

[project.scripts]
docindex = "docindex_cli.cli:cli"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
