[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "docindex-core"
version = "0.1.0"
description = "Reusable core indexing/search primitives for Meilisearch-backed document search"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.13.4",
  "meilisearch>=0.41.1",
  "pyyaml>=6.0.3"
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
