[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "docindex-sphinx"
version = "0.1.0"
description = "Sphinx extension hooks for docindex-core"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "docindex-core>=0.1.0",
  "sphinx>=7.0.0"
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
